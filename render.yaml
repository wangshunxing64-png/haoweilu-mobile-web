services:
  - type: web
    name: haoweilu-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && npm run db:seed && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: haoweilu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: haoweilu-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://haoweilu-mobile-web.pages.dev
      - key: PUBLIC_API_BASE_URL
        value: https://haoweilu-api.onrender.com
      - key: ENABLE_API_DOCS
        value: "false"
      - key: AI_PROVIDER
        value: local-template
      - key: DEFAULT_AI_PROVIDER
        value: local-template
      - key: ADMIN_API_KEY
        generateValue: true

  - type: keyvalue
    name: haoweilu-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: haoweilu-postgres
    plan: free
    region: singapore
    databaseName: haoweilu
    user: haoweilu
    postgresMajorVersion: "17"

